# SEC-14 (Sprint 9): solo se aceptan conexiones de red cifradas. "local" es el socket dentro del pod
# (lo usan pg_isready y el mantenimiento); cualquier conexión TCP sin TLS se rechaza.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: expediente-judicial
data:
  pg_hba.conf: |
    local     all  all                trust
    hostssl   all  all  0.0.0.0/0     scram-sha-256
    hostssl   all  all  ::/0          scram-sha-256
    hostnossl all  all  0.0.0.0/0     reject
    hostnossl all  all  ::/0          reject
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: expediente-judicial
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # usuario "postgres" de la imagen alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          # SEC-14: TLS con el certificado de cert-manager (k8s/015-certificados.yaml) y pg_hba que exige TLS
          args:
            - "-c"
            - "ssl=on"
            - "-c"
            - "ssl_cert_file=/etc/postgres-tls/tls.crt"
            - "-c"
            - "ssl_key_file=/etc/postgres-tls/tls.key"
            - "-c"
            - "ssl_min_protocol_version=TLSv1.2"
            - "-c"
            - "hba_file=/etc/postgres-hba/pg_hba.conf"
          env:
            - {name: POSTGRES_DB, value: expedientes}
            - {name: POSTGRES_USER, value: judicial}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secrets, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "judicial", "-d", "expedientes"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "judicial", "-d", "expedientes"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tls, mountPath: /etc/postgres-tls, readOnly: true}
            - {name: hba, mountPath: /etc/postgres-hba, readOnly: true}
      volumes:
        # 0640 y grupo 70 (fsGroup): PostgreSQL acepta una llave de root legible solo por su grupo
        - name: tls
          secret: {secretName: postgres-tls, defaultMode: 0640}
        - name: hba
          configMap: {name: postgres-hba}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: expediente-judicial
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
