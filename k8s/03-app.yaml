apiVersion: apps/v1
kind: Deployment
metadata:
  name: expediente-api
  namespace: expediente-judicial
  labels: {app: expediente-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: expediente-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # despliegue sin caída
  template:
    metadata:
      labels: {app: expediente-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: expediente-api:latest   # el pipeline lo reemplaza por la imagen con el SHA del commit
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: app-secrets, key: JWT_SECRET}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: app-secrets, key: DATABASE_URL}}
            - name: SEED_PASSWORD   # SEC-03: clave demo aleatoria por despliegue (la genera el pipeline)
              valueFrom: {secretKeyRef: {name: app-secrets, key: SEED_PASSWORD, optional: true}}
            - name: AUDIT_KEY   # SEC-10 (Sprint 7): clave HMAC de la bitácora, fuera de la BD
              valueFrom: {secretKeyRef: {name: app-secrets, key: AUDIT_KEY}}
            - name: DOCUMENTOS_DIR   # HU-10 (Sprint 7)
              value: /data/documentos
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: documentos, mountPath: /data/documentos}
            - {name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true}   # SEC-14: verify-full
      volumes:
        - {name: tmp, emptyDir: {}}
        # HU-10: en staging basta emptyDir; en producción real usar un PersistentVolumeClaim ReadWriteMany
        # (las 2 réplicas deben ver los mismos PDF) o un almacenamiento de objetos.
        - {name: documentos, emptyDir: {}}
        # SEC-14 (Sprint 9): solo la CA, para que la app verifique el certificado de PostgreSQL
        - name: postgres-ca
          secret:
            secretName: postgres-tls
            items: [{key: ca.crt, path: ca.crt}]
---
apiVersion: v1
kind: Service
metadata:
  name: expediente-api
  namespace: expediente-judicial
spec:
  type: ClusterIP   # SEC-03: ya no se publica en el nodo; SEC-14: se entra por el Ingress HTTPS (k8s/04-ingress.yaml)
  selector: {app: expediente-api}
  ports:
    - port: 80
      targetPort: 8000
