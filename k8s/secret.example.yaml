# OJO: esto es un ejemplo. Nunca subas secretos reales al repo.
# JWT_SECRET: con APP_ENV=produccion debe tener >= 32 caracteres (openssl rand -hex 32).
# En CI se crea con: kubectl create secret generic app-secrets --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: expediente-judicial
type: Opaque
stringData:
  JWT_SECRET: "reemplazar-en-ci"
  POSTGRES_PASSWORD: "reemplazar-en-ci"
  # SEC-14 (Sprint 9): TLS obligatorio y verificación del certificado de PostgreSQL con la CA montada por 03-app.yaml
  DATABASE_URL: "postgresql+psycopg://judicial:reemplazar-en-ci@postgres:5432/expedientes?sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt"
  SEED_PASSWORD: "solo-staging-reemplazar-en-ci"
  AUDIT_KEY: "reemplazar-en-ci-openssl-rand-hex-32"   # SEC-10 (Sprint 7): obligatoria con APP_ENV=produccion   # SEC-03: obligatorio si SEED_DEMO=1 con APP_ENV=produccion
